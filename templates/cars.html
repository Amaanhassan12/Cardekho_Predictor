{% extends "base.html" %}
{% block content %}
<h1>Browse Cars</h1>
<div class="box">
<form class="filters" method="get">
  <label>Brand
    <select name="brand"><option value="">All</option>
    {% for b in brands %}<option value="{{ b }}" {{ 'selected' if b==sel_brand }}>{{ b }}</option>{% endfor %}</select></label>
  <label>Fuel
    <select name="fuel"><option value="">All</option>
    {% for f in fuels %}<option value="{{ f }}" {{ 'selected' if f==sel_fuel }}>{{ f }}</option>{% endfor %}</select></label>
  <label>Max price (lakh ₹)
    <input type="number" step="0.1" name="max_price" value="{{ sel_price }}" placeholder="e.g. 8"></label>
  <button type="submit">Search</button>
</form>
</div>
<p>{{ total }} cars found (showing top 100 by price)</p>
<div class="box scroll">
<table>
<tr><th>Car</th><th>Brand</th><th>Age</th><th>KM</th><th>Fuel</th><th>Gear</th><th>Mileage</th><th>Engine</th><th>Power</th><th>Seats</th><th>Price (L)</th></tr>
{% for r in rows %}<tr>{% for c in r %}<td>{{ c }}</td>{% endfor %}</tr>{% endfor %}
</table>
</div>
{% endblock %}
